services:
  postgres:
    image: postgres:17
    container_name: equipoise-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-equipoisedb}
      POSTGRES_USER: ${POSTGRES_USER:-equipoise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-equipoise_secret_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-equipoise} -d ${POSTGRES_DB:-equipoisedb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: equipoise-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/equipoisedb}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-equipoise}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-equipoise_secret_password}
      JWT_SECRET: ${JWT_SECRET:-EquipoiseProductionSecretKeyForJwtTokensThatIsLongEnough2026_SecureKey}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
        VITE_USE_MOCK: "false"
    container_name: equipoise-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  postgres_data:
