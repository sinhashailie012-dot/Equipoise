services:
  postgres:
    image: postgres:16-alpine
    container_name: equipoise-postgres
    restart: always
    environment:
      POSTGRES_DB: equipoisedb
      POSTGRES_USER: equipoise
      POSTGRES_PASSWORD: equipoise_secret_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equipoise -d equipoisedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: equipoise-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/equipoisedb
      SPRING_DATASOURCE_USERNAME: equipoise
      SPRING_DATASOURCE_PASSWORD: equipoise_secret_password
      JWT_SECRET: EquipoiseProductionSecretKeyForJwtTokensThatIsLongEnough2026_SecureKey
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api
        VITE_USE_MOCK: "false"
    container_name: equipoise-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
